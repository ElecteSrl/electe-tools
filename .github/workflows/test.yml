name: Tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      # No lockfile is exported (the three dev dependencies float with the
      # website's), so the install is a plain npm install.
      - run: npm install --no-fund --no-audit
      - run: npm run typecheck
      - run: npm test
